<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Illustration of a Mach 5 aircraft with thermal loading shown on its leading edges</title>
  <desc id="d">A technical line drawing of a slender swept-wing hypersonic aircraft concept seen from the side and slightly above. The nose tip, wing leading edges and fin leading edge are shaded from hot to cool to show where a thermal protective coating carries the greatest heat load. Annotation leaders label the coated leading edge and the fuselage coating, with a Mach 5 freestream marker ahead of the nose.</desc>

  <defs>
    <!-- Heat ramps fade to zero opacity rather than to a flat grey, so a
         stroke dies away along the surface instead of ending in a bar. -->
    <linearGradient id="noseHeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#A8330B" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#C85520" stop-opacity=".92"/>
      <stop offset="0.62" stop-color="#9A6B50" stop-opacity=".5"/>
      <stop offset="1"    stop-color="#6B757B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edgeHeat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#C85520" stop-opacity=".92"/>
      <stop offset="0.55" stop-color="#9A6B50" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#6B757B" stop-opacity=".12"/>
    </linearGradient>

    <radialGradient id="stag" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#C85520" stop-opacity=".30"/>
      <stop offset="0.45" stop-color="#C85520" stop-opacity=".09"/>
      <stop offset="1"    stop-color="#C85520" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F6F7F5"/>
      <stop offset="0.52" stop-color="#E7EBE8"/>
      <stop offset="1"   stop-color="#D4DAD6"/>
    </linearGradient>

    <linearGradient id="legend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B757B"/>
      <stop offset="0.5" stop-color="#8E6B55"/>
      <stop offset="1" stop-color="#A8330B"/>
    </linearGradient>
  </defs>

  <style>
    .edge  { stroke:#121619; stroke-width:2.2; stroke-linejoin:round; }
    .thin  { fill:none; stroke:#A2ABAF; stroke-width:1.1; }
    .lead  { fill:none; stroke:#1E6B5C; stroke-width:1; }
    .rule  { fill:none; stroke:#C9CFCB; stroke-width:1.3; }
    .hotN  { fill:none; stroke:url(#noseHeat); stroke-width:8; stroke-linecap:round; }
    .hotE  { fill:none; stroke:url(#edgeHeat); stroke-width:7; stroke-linecap:round; }
    .lbl   { font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:20px; fill:#1E6B5C; }
    .sub   { font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:17px; fill:#5A656D; }
    .dim   { font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:16px; fill:#78838A; }
  </style>

  <!-- drawing frame -->
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#D2D7D3" stroke-width="1.4"/>
  <g fill="none" stroke="#121619" stroke-width="1.2">
    <path d="M28 78 h32 M78 28 v32"/>
    <path d="M1172 78 h-32 M1122 28 v32"/>
    <path d="M28 822 h32 M78 872 v-32"/>
    <path d="M1172 822 h-32 M1122 872 v-32"/>
  </g>

  <!-- freestream, ahead of the nose -->
  <text class="dim" x="66" y="164">freestream</text>
  <g class="rule">
    <path d="M66 196 h146 m-12 -5 l12 5 l-12 5"/>
    <path d="M66 232 h116 m-12 -5 l12 5 l-12 5"/>
    <path d="M66 268 h146 m-12 -5 l12 5 l-12 5"/>
  </g>
  <text class="lbl" x="66" y="314">M 5.0</text>

  <!-- stagnation heating -->
  <ellipse cx="168" cy="478" rx="104" ry="80" fill="url(#stag)"/>

  <!-- =================== airframe =================== -->
  <g>
    <!-- far wing, behind the fuselage -->
    <path class="edge" fill="#C8CFCA" d="M598 436 L 812 382 L 872 390 L 886 434 Z"/>

    <!-- vertical fin -->
    <path class="edge" fill="#DCE1DD" d="M828 420 L 908 258 L 952 262 L 966 420 Z"/>
    <path class="thin" d="M874 404 L 924 300"/>

    <!-- fuselage -->
    <path class="edge" fill="url(#body)" d="
      M130 478
      C 292 450, 452 428, 612 422
      L 884 422
      C 942 422, 980 430, 1000 442
      L 1000 508
      C 980 518, 942 526, 884 526
      L 622 526
      C 462 522, 292 502, 130 478
      Z"/>

    <!-- canopy -->
    <path class="edge" fill="#C8CFCA" d="M392 436 C 424 412, 486 408, 530 422 Z"/>
    <path class="thin" d="M392 436 C 426 426, 482 422, 530 422"/>

    <!-- fuselage panel lines -->
    <path class="thin" d="M300 462 C 460 442, 640 434, 880 434"/>
    <path class="thin" d="M300 492 C 460 506, 640 512, 880 512"/>
    <path class="thin" d="M660 424 L 660 524 M760 424 L 760 526"/>

    <!-- near wing, swept back and toward the viewer -->
    <path class="edge" fill="#E7EBE8" d="M548 504 L 838 606 L 918 616 L 898 524 Z"/>
    <path class="thin" d="M620 530 L 880 600"/>
    <path class="thin" d="M838 606 L 898 524"/>

    <!-- horizontal stabiliser -->
    <path class="edge" fill="#DCE1DD" d="M898 522 L 984 558 L 1032 556 L 998 518 Z"/>

    <!-- nozzle -->
    <path class="edge" fill="#C8CFCA" d="M1000 442 L 1042 452 L 1042 498 L 1000 508 Z"/>
    <path class="thin" d="M1020 448 L 1020 502"/>
  </g>

  <!-- =================== thermal load =================== -->
  <path class="hotN" d="M130 478 C 254 458, 382 440, 532 428"/>
  <path class="hotN" d="M130 478 C 254 498, 390 516, 540 522" opacity=".5"/>
  <path class="hotE" d="M548 504 L 838 606"/>
  <path class="hotE" d="M598 436 L 812 382"/>
  <path class="hotE" d="M828 420 L 908 258"/>

  <!-- =================== annotation =================== -->
  <g>
    <path class="lead" d="M700 411 L 744 212 L 1048 212"/>
    <circle cx="700" cy="411" r="4.5" fill="#1E6B5C"/>
    <text class="lbl" x="1048" y="204" text-anchor="end">coated leading edge</text>
    <text class="sub" x="1048" y="230" text-anchor="end">peak thermal load</text>
  </g>

  <g>
    <path class="lead" d="M520 518 L 468 712 L 142 712"/>
    <circle cx="520" cy="518" r="4.5" fill="#1E6B5C"/>
    <text class="lbl" x="142" y="704">fuselage coating</text>
    <text class="sub" x="142" y="730">ceramic chemistries under assessment</text>
  </g>

  <!-- legend -->
  <g transform="translate(700,804)">
    <rect x="0" y="-14" width="196" height="10" fill="url(#legend)"/>
    <text class="dim" x="0" y="18">cool</text>
    <text class="dim" x="196" y="18" text-anchor="end">hot</text>
    <text class="sub" x="0" y="-28">relative surface temperature</text>
  </g>

  <text class="dim" x="142" y="802">illustrative concept — not a drawing of the INVICTUS vehicle</text>
</svg>
